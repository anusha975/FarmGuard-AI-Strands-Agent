services:
  - type: web
    name: farmguard-ai
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FARMGARD_MODE
        value: live
      - key: AWS_REGION
        value: us-east-1

