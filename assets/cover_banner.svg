<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#062412"/>
      <stop offset="45%" stop-color="#0A3A1E"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    
    <!-- Accent Gradients -->
    <linearGradient id="accentOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF9900"/>
      <stop offset="100%" stop-color="#FF5500"/>
    </linearGradient>

    <linearGradient id="accentGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#16A34A"/>
    </linearGradient>

    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.04"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Subtle Agro-Grid Overlay -->
  <g opacity="0.08" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="90" x2="1200" y2="90"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="0" y1="450" x2="1200" y2="450"/>
    <line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="150" y1="0" x2="150" y2="630"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="450" y1="0" x2="450" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="750" y1="0" x2="750" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="1050" y1="0" x2="1050" y2="630"/>
  </g>

  <!-- Glowing Circular Orbs -->
  <circle cx="1080" cy="120" r="180" fill="#22C55E" opacity="0.15" filter="url(#glow)"/>
  <circle cx="100" cy="500" r="160" fill="#FF9900" opacity="0.10" filter="url(#glow)"/>

  <!-- Top Brand Tag -->
  <g transform="translate(80, 75)">
    <rect width="320" height="36" rx="18" fill="#FFFFFF" fill-opacity="0.08" stroke="#22C55E" stroke-width="1.2"/>
    <circle cx="20" cy="18" r="6" fill="#22C55E"/>
    <text x="36" y="23" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#86EFAC" letter-spacing="1">AWS STRANDS AGENTS SDK</text>
  </g>

  <!-- Main Title -->
  <g transform="translate(80, 165)">
    <text font-family="system-ui, -apple-system, sans-serif" font-size="54" font-weight="900" fill="#FFFFFF" letter-spacing="-0.02em">
      🌾 FarmGuard AI
    </text>
    <text y="48" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="700" fill="#FBBF24">
      Climate Resilience Agent for Smallholder Farmers
    </text>
    <text y="88" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="400" fill="#CBD5E1">
      Autonomous multi-tool drought intelligence grounded in FAO-56 crop hydrology &amp; Amazon Bedrock
    </text>
  </g>

  <!-- Left Side Badges -->
  <g transform="translate(80, 290)">
    <!-- Pill 1: Bedrock -->
    <rect x="0" y="0" width="220" height="34" rx="8" fill="#1E293B" stroke="#94A3B8" stroke-width="1"/>
    <text x="16" y="22" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#E2E8F0">☁️ Amazon Bedrock (Claude 3.5)</text>

    <!-- Pill 2: FAO-56 -->
    <rect x="235" y="0" width="180" height="34" rx="8" fill="#1E293B" stroke="#94A3B8" stroke-width="1"/>
    <text x="250" y="22" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#E2E8F0">🔬 FAO-56 Soil Physics</text>

    <!-- Pill 3: Bilingual -->
    <rect x="430" y="0" width="180" height="34" rx="8" fill="#1E293B" stroke="#94A3B8" stroke-width="1"/>
    <text x="445" y="22" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#E2E8F0">🌐 English &amp; తెలుగు (Telugu)</text>
  </g>

  <!-- Right Visual Cards (Dashboard Mockup) -->
  <g transform="translate(680, 95)" filter="url(#shadow)">
    <!-- Main Card Container -->
    <rect width="440" height="450" rx="20" fill="url(#cardBg)" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="1.5"/>

    <!-- Inner Card Header -->
    <rect x="20" y="20" width="400" height="48" rx="10" fill="#14532D" fill-opacity="0.5" stroke="#22C55E" stroke-opacity="0.3"/>
    <text x="40" y="50" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#86EFAC">🟢 LIVE TELEMETRY | Open-Meteo API</text>
    <text x="320" y="50" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#FDE047">Anantapur, AP</text>

    <!-- Metric Tile 1: Drought Score -->
    <g transform="translate(25, 85)">
      <rect width="185" height="100" rx="12" fill="#0F172A" fill-opacity="0.7" stroke="#EF4444" stroke-width="1"/>
      <text x="16" y="28" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#F87171">🔥 DROUGHT HAZARD</text>
      <text x="16" y="65" font-family="system-ui, sans-serif" font-size="30" font-weight="900" fill="#FFFFFF">54.5%</text>
      <text x="16" y="86" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#94A3B8">Risk Level: High Warning</text>
    </g>

    <!-- Metric Tile 2: Soil CWSI -->
    <g transform="translate(230, 85)">
      <rect width="185" height="100" rx="12" fill="#0F172A" fill-opacity="0.7" stroke="#38BDF8" stroke-width="1"/>
      <text x="16" y="28" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#7DD3FC">💧 SOIL DEPLETION (Dr)</text>
      <text x="16" y="65" font-family="system-ui, sans-serif" font-size="30" font-weight="900" fill="#FFFFFF">68.2 <tspan font-size="14">mm</tspan></text>
      <text x="16" y="86" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#94A3B8">CWSI Stress Index: 0.58</text>
    </g>

    <!-- 2G SMS Alert Box (Telugu & English) -->
    <g transform="translate(25, 205)">
      <rect width="390" height="135" rx="12" fill="#020617" stroke="#F59E0B" stroke-width="1.2"/>
      <text x="18" y="28" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#FBBF24">📱 2G CELLULAR SMS DISPATCH (తెలుగు)</text>
      <text x="18" y="55" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="600" fill="#F8FAFC">🌾 ఫామ్‌గార్డ్ అలర్ట్ | పంట: వేరుశనగ</text>
      <text x="18" y="80" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#E2E8F0">ఎండ తీవ్రత వల్ల సాయంత్రం లేదా రాత్రి మాత్రమే తడి ఇవ్వండి.</text>
      <text x="18" y="102" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#E2E8F0">పూత రాలకుండా నేలపై ఎండుగడ్డితో ఆచ్ఛాదన (Mulching) చేయండి.</text>
      <text x="18" y="122" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#4ADE80">✓ Verified FAO-56 Dual Crop Water Balance</text>
    </g>

    <!-- Bottom Status Bar -->
    <g transform="translate(25, 360)">
      <rect width="390" height="65" rx="10" fill="#15803D" fill-opacity="0.3" stroke="#22C55E" stroke-width="1"/>
      <text x="18" y="28" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#86EFAC">⚡ IMMEDIATE 24-48H ACTION PLAN</text>
      <text x="18" y="50" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#F0FDF4">Shift to evening deficit irrigation; apply straw mulch to rootzone</text>
    </g>
  </g>

  <!-- Bottom Metadata Footer -->
  <g transform="translate(80, 560)">
    <text font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#64748B">
      AWS AI Agents Hackathon Project | Built with official Strands Agents SDK &amp; Amazon Bedrock | Author: Anusha (@anusha975)
    </text>
  </g>
</svg>
